name: Insurance Integration CD/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean install -DskipTests
    - name: Copy JAR to Linux server
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "target/insurance-integration-0.0.1-SNAPSHOT.jar"
        target: "/opt/insurance-integration/bin/"
        overwrite: true


  
  
  
  

    
  success_notify:
    needs: ['build']
    if: always() && !failure()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Success
        run: echo "Success email sent to the team"
