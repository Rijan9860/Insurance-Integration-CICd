name: Insurance Integration CD/CD

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean install -DskipTests
    - name: Run remote command via SSH
      uses: D3rHase/ssh-command-action@latest
      with:
        host: ${{ secrets.SERVER_HOST }}
        port: ${{ secrets.SERVER_PORT }}
        user: ${{ secrets.SERVER_USER }}
        private_key: ${{ secrets.SERVER_SSH_KEY }}
        host_fingerprint: ${{ secrets.HOST_fingerprint }}
        command: echo "Connection is successful!!"
        
  success_notify:
    needs: ['build']
    if: always() && !failure()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Success
        run: echo "Success email sent to the team"
